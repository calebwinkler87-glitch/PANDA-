<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll Panda</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#scroller{height:100vh;width:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
#track{height:450vh;position:relative}#stage{height:100vh;position:sticky;top:0;overflow:hidden;background:transparent}
#panda{position:absolute;top:50%;left:0;transform:translateY(-50%);width:clamp(220px,32vw,420px);height:auto;aspect-ratio:1;object-fit:contain;image-rendering:auto}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font:12px Arial,sans-serif;color:#777;pointer-events:none;background:#ffffffb8;border-radius:10px;padding:5px 9px}
</style></head><body>
<div id="scroller" aria-label="Scroll to control panda animation" tabindex="0"><div id="track"><div id="stage"><canvas id="panda" width="150" height="150" role="img" aria-label="Animated panda controlled by scrolling"></canvas><div id="hint">Scroll here to move the panda across the screen ↕</div></div></div></div>
<script>
const FRAME_COUNT=180,COLS=15,FRAME_W=150,FRAME_H=150;
const scroller=document.getElementById('scroller'),stage=document.getElementById('stage'),canvas=document.getElementById('panda');
const ctx=canvas.getContext('2d');const sheet=new Image();sheet.src='./panda-spritesheet.png';
let ready=false;
function render(){
 const max=Math.max(1,scroller.scrollHeight-scroller.clientHeight);
 const p=Math.min(1,Math.max(0,scroller.scrollTop/max));
 const index=Math.min(FRAME_COUNT-1,Math.floor(p*(FRAME_COUNT-1)+0.5));
 const size=canvas.getBoundingClientRect().width;
 const x=p*Math.max(0,stage.clientWidth-size);
 canvas.style.left=x+'px';
 if(!ready)return;
 ctx.clearRect(0,0,FRAME_W,FRAME_H);
 ctx.drawImage(sheet,(index%COLS)*FRAME_W,Math.floor(index/COLS)*FRAME_H,FRAME_W,FRAME_H,0,0,FRAME_W,FRAME_H);
}
sheet.onload=()=>{ready=true;render()};
scroller.addEventListener('scroll',render,{passive:true});window.addEventListener('resize',render);
render();
</script></body></html>
